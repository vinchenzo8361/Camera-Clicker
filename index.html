<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Camera Clicker</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="layout">
        <div id="game">
            <div id="scoreBoard">
                <h1>Photos: <span id="score">0</span></h1>
                <p id="cpsDisplay">per second: 0.0</p>
            </div>
            <button id="cameraBtn">📷</button>
        </div>
        
        <div id="shop">
            <h2>Upgrade Shop!</h2>
            
            <div class="upgrade" id="buyAutoFlash">
                <div class="upgrade-info">
                    <h3>⚡ Auto Flash</h3>
                    <p>+0.1 photos/sec</p>
                </div>
                <button id="autoFlashBtn" disabled>Buy: <span id="autoFlashCost">50</span></button>
            </div>

            <div class="upgrade" id="buyGranny">
                <div class="upgrade-info">
                    <h3>👵 Photographer Granny</h3>
                    <p>+1.0 photos/sec</p>
                </div>
                <button id="grannyBtn" disabled>Buy: <span id="grannyCost">450</span></button>
            </div>
            
            <div class="upgrade" id="buyLens">
                <div class="upgrade-info">
                    <h3>✨ Magic Lens</h3>
                    <p>+1 per manual click</p>
                </div>
                <button id="lensBtn" disabled>Buy: <span id="lensCost">1000</span></button>
            </div>
            
        </div>
    </div>
    <script src="script.js"></script>
    <!-- ADMIN PANEL -->
    <div id="adminPanel">
        <h3>🛠️ Dev Tools</h3>
        <p style="margin:0 0 10px 0; font-size:0.8rem; color:#aaa;">(Press  to hide)</p>
        <button id="adminAddScore">+10,000 Photos</button>
        <button id="adminSpawnGold">Force Golden Camera</button>
        <button id="adminReset">Wipe Save File</button>
    </div>
</body>
</html>
