<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Camera Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="layout">
        <!-- Main Game Area -->
        <div id="game">
            <div id="scoreBoard">
                <h1>Photos: <span id="score">0.0</span></h1>
            </div>
            <button id="cameraBtn">📷</button>
        </div>
        
        <!-- Shop Sidebar -->
        <div id="shop">
            <h2>Shop</h2>
            
            <div class="upgrade" id="buyAutoFlash">
                <div class="upgrade-info">
                    <h3>Auto Flash (<span id="autoFlashCount">0</span>)</h3>
                    <p>+0.1 photos/sec</p>
                </div>
                <button id="autoFlashBtn" disabled>Cost: <span id="autoFlashCost">50</span></button>
            </div>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
